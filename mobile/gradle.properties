org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.x fue probado oficialmente hasta compileSdk 35; el SDK local de
# este entorno solo tiene la plataforma 36 instalada (no 35), así que se
# usa compileSdk=36 y se silencia la advertencia informativa de AGP.
android.suppressUnsupportedCompileSdk=36
